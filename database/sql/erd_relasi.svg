<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="background:#f8fafc; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <!-- Marker for relation line -->
    <marker id="crow" viewBox="0 0 20 20" refX="10" refY="10" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 10 L 0 20 M 10 0 L 10 20" fill="none" stroke="#475569" stroke-width="2" />
    </marker>
    <marker id="one" viewBox="0 0 20 20" refX="10" refY="10" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 5 0 L 5 20 M 12 0 L 12 20" fill="none" stroke="#475569" stroke-width="2" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Skema Relasi Basis Data (Entity Relationship Diagram)</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#64748b">Relasi Satu-ke-Banyak (1:N) Antara Tabel program_studi dan mahasiswa</text>

  <!-- TABLE: program_studi (PARENT) -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="280" height="170" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 270 0 Q 280 0 280 10 L 280 44 L 0 44 Z" fill="url(#headerGrad1)" />
    <text x="140" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">program_studi</text>
    
    <!-- Columns Header / Divider -->
    <line x1="0" y1="44" x2="280" y2="44" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Row 1: id (PK) -->
    <rect x="0" y="44" width="280" height="42" fill="#fff7ed" />
    <text x="16" y="70" font-size="12" font-weight="700" fill="#c2410c">PK</text>
    <text x="45" y="70" font-size="13" font-weight="600" fill="#1e293b">id</text>
    <text x="264" y="70" text-anchor="end" font-size="12" fill="#64748b">BIGINT UNSIGNED</text>
    <line x1="0" y1="86" x2="280" y2="86" stroke="#fed7aa" stroke-width="1" />

    <!-- Row 2: nama_prodi (UQ) -->
    <text x="16" y="116" font-size="12" font-weight="700" fill="#0284c7">UQ</text>
    <text x="45" y="116" font-size="13" font-weight="600" fill="#1e293b">nama_prodi</text>
    <text x="264" y="116" text-anchor="end" font-size="12" fill="#64748b">VARCHAR(100)</text>

    <!-- Footer info -->
    <line x1="0" y1="135" x2="280" y2="135" stroke="#f1f5f9" stroke-width="1" />
    <text x="140" y="154" text-anchor="middle" font-size="11" fill="#94a3b8">Storage Engine: InnoDB</text>
  </g>

  <!-- TABLE: mahasiswa (CHILD) -->
  <g transform="translate(560, 90)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="300" height="360" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 290 0 Q 300 0 300 10 L 300 44 L 0 44 Z" fill="url(#headerGrad2)" />
    <text x="150" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">mahasiswa</text>
    
    <line x1="0" y1="44" x2="300" y2="44" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Row 1: id (PK) -->
    <rect x="0" y="44" width="300" height="36" fill="#f0f9ff" />
    <text x="16" y="67" font-size="12" font-weight="700" fill="#c2410c">PK</text>
    <text x="45" y="67" font-size="13" font-weight="600" fill="#1e293b">id</text>
    <text x="284" y="67" text-anchor="end" font-size="12" fill="#64748b">BIGINT UNSIGNED</text>
    <line x1="0" y1="80" x2="300" y2="80" stroke="#bae6fd" stroke-width="1" />

    <!-- Row 2: nim (UQ) -->
    <text x="16" y="103" font-size="12" font-weight="700" fill="#0284c7">UQ</text>
    <text x="45" y="103" font-size="13" font-weight="600" fill="#1e293b">nim</text>
    <text x="284" y="103" text-anchor="end" font-size="12" fill="#64748b">CHAR(10)</text>
    <line x1="0" y1="116" x2="300" y2="116" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 3: nama -->
    <text x="45" y="139" font-size="13" font-weight="600" fill="#1e293b">nama</text>
    <text x="284" y="139" text-anchor="end" font-size="12" fill="#64748b">VARCHAR(100)</text>
    <line x1="0" y1="152" x2="300" y2="152" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 4: email (UQ) -->
    <text x="16" y="175" font-size="12" font-weight="700" fill="#0284c7">UQ</text>
    <text x="45" y="175" font-size="13" font-weight="600" fill="#1e293b">email</text>
    <text x="284" y="175" text-anchor="end" font-size="12" fill="#64748b">VARCHAR(100)</text>
    <line x1="0" y1="188" x2="300" y2="188" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 5: usia -->
    <text x="16" y="211" font-size="11" font-weight="700" fill="#059669">CHK</text>
    <text x="45" y="211" font-size="13" font-weight="600" fill="#1e293b">usia</text>
    <text x="284" y="211" text-anchor="end" font-size="12" fill="#64748b">TINYINT (17..60)</text>
    <line x1="0" y1="224" x2="300" y2="224" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 6: program_studi_id (FK) -->
    <rect x="0" y="224" width="300" height="36" fill="#fef3c7" />
    <text x="16" y="247" font-size="12" font-weight="700" fill="#d97706">FK</text>
    <text x="45" y="247" font-size="13" font-weight="700" fill="#92400e">program_studi_id</text>
    <text x="284" y="247" text-anchor="end" font-size="12" fill="#b45309">BIGINT UNSIGNED</text>
    <line x1="0" y1="260" x2="300" y2="260" stroke="#fde68a" stroke-width="1" />

    <!-- Row 7: created_at -->
    <text x="45" y="283" font-size="13" fill="#475569">created_at</text>
    <text x="284" y="283" text-anchor="end" font-size="12" fill="#64748b">TIMESTAMP</text>
    <line x1="0" y1="296" x2="300" y2="296" stroke="#f1f5f9" stroke-width="1" />

    <!-- Row 8: updated_at -->
    <text x="45" y="319" font-size="13" fill="#475569">updated_at</text>
    <text x="284" y="319" text-anchor="end" font-size="12" fill="#64748b">TIMESTAMP</text>

    <!-- Footer info -->
    <line x1="0" y1="334" x2="300" y2="334" stroke="#f1f5f9" stroke-width="1" />
    <text x="150" y="350" text-anchor="middle" font-size="11" fill="#94a3b8">CASCADE update, RESTRICT delete</text>
  </g>

  <!-- RELATION CONNECTOR LINE -->
  <!-- From program_studi(id) at (340, 155) to mahasiswa(program_studi_id) at (560, 332) -->
  <path d="M 340 155 L 430 155 L 430 332 L 560 332" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="none" />
  
  <!-- Cardinality Badges -->
  <rect x="350" y="138" width="34" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="367" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">1</text>

  <rect x="515" y="315" width="34" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="532" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">N</text>

  <!-- Relationship Label Box -->
  <rect x="380" y="222" width="102" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)" />
  <text x="431" y="239" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">1 : N Relasi</text>
  <text x="431" y="254" text-anchor="middle" font-size="9" fill="#64748b">fk_mhs_prodi</text>

  <!-- Bottom Explanatory Caption -->
  <text x="460" y="468" text-anchor="middle" font-size="12" fill="#64748b">Atribut program_studi_id pada mahasiswa bertindak sebagai Foreign Key merujuk ke id pada program_studi</text>
</svg>
